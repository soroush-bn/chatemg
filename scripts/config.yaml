# ChatEMG Training Configuration
# Example usage: python train.py
# Override values: python train.py batch_size=32 learning_rate=0.0005

# Experiment settings
exp_name: "exp"
filter_class: 0  # [0=relax, 1=open, 2=close]

# Evaluation and logging
eval_interval: 2500
log_interval: 10
eval_iters: 200
eval_only: false
always_save_checkpoint: true
init_from: "scratch"

# Wandb logging
wandb_log: false
wandb_project: "chatemg"

# Data settings
gradient_accumulation_steps: 1
batch_size: 64
block_size: 256
split: 0.8
ckpt_path: null

# Model architecture
model_type: "GPT_interchannel"
token_embedding_type: "basic_sum"
n_layer: 12
n_head: 8
n_embd: 256
dropout: 0.2
bias: false

# Optimizer settings
learning_rate: 0.001
max_iters: 100000
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0

# Learning rate decay
decay_lr: true
warmup_iters: 2000
lr_decay_iters: 100000
min_lr: 0.0001

# System settings
backend: "nccl"
device: "cuda"
dtype: "float16"
compile: true

# Preprocessing
median_filter_size: 9

# Data files
train_csv_files: []
test_csv_files: []
sample_data_files:
  - "../data/converted_final_df.csv"

# Additional settings
split_seed: 42
vocab_size: 1000
